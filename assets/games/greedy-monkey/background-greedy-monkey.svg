<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1600" viewBox="0 0 720 1600" fill="none">
<defs>
<linearGradient id="bg-gradient" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#1a2a3a"/>
<stop offset="0.15" stop-color="#0d1b2a"/>
<stop offset="0.4" stop-color="#081625"/>
<stop offset="0.7" stop-color="#05101a"/>
<stop offset="1" stop-color="#030812"/>
</linearGradient>
<linearGradient id="wheel-area" x1="0" y1="0.35" x2="0" y2="0.7">
<stop offset="0" stop-color="#f5efe6"/>
<stop offset="0.5" stop-color="#ede3d9"/>
<stop offset="1" stop-color="#e8ddd0"/>
</linearGradient>
<linearGradient id="teal-accent" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#26a9c7"/>
<stop offset="1" stop-color="#1a8aa6"/>
</linearGradient>
<radialGradient id="wheel-glow" cx="50%" cy="55%" r="30%">
<stop offset="0" stop-color="#26a9c7" stop-opacity="0.15"/>
<stop offset="1" stop-color="#26a9c7" stop-opacity="0"/>
</radialGradient>
<filter id="soft-shadow">
<feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
</filter>
</defs>
<rect width="720" height="1600" fill="url(#bg-gradient)"/>
<ellipse cx="360" cy="800" rx="300" ry="280" fill="url(#wheel-area)" filter="url(#soft-shadow)"/>
<ellipse cx="360" cy="800" rx="280" ry="260" fill="none" stroke="url(#teal-accent)" stroke-width="2" opacity="0.3"/>
<rect x="0" y="0" width="720" height="150" fill="#1a1a1a" opacity="0.8"/>
<rect x="0" y="1400" width="720" height="200" fill="#ffffff" opacity="0.95"/>
<rect x="0" y="1400" width="720" height="4" fill="url(#teal-accent)"/>
</svg>