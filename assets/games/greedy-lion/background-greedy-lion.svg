<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1600" viewBox="0 0 720 1600" fill="none">
<defs>
<linearGradient id="bg-gradient" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#1a1a1a"/>
<stop offset="0.15" stop-color="#0d0d0d"/>
<stop offset="0.4" stop-color="#080808"/>
<stop offset="0.7" stop-color="#050505"/>
<stop offset="1" stop-color="#030303"/>
</linearGradient>
<linearGradient id="wheel-area" x1="0" y1="0.35" x2="0" y2="0.7">
<stop offset="0" stop-color="#fff8e7"/>
<stop offset="0.5" stop-color="#fdf4e0"/>
<stop offset="1" stop-color="#f9efe0"/>
</linearGradient>
<linearGradient id="gold-accent" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#fbd42a"/>
<stop offset="0.5" stop-color="#f5c000"/>
<stop offset="1" stop-color="#e6b000"/>
</linearGradient>
<radialGradient id="wheel-glow" cx="50%" cy="55%" r="30%">
<stop offset="0" stop-color="#fbd42a" stop-opacity="0.2"/>
<stop offset="1" stop-color="#fbd42a" stop-opacity="0"/>
</radialGradient>
<filter id="soft-shadow">
<feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
</filter>
</defs>
<rect width="720" height="1600" fill="url(#bg-gradient)"/>
<ellipse cx="360" cy="800" rx="300" ry="280" fill="url(#wheel-area)" filter="url(#soft-shadow)"/>
<ellipse cx="360" cy="800" rx="280" ry="260" fill="none" stroke="url(#gold-accent)" stroke-width="2" opacity="0.4"/>
<rect x="0" y="0" width="720" height="150" fill="#000000" opacity="0.9"/>
<rect x="0" y="1400" width="720" height="200" fill="#d6d6d6" opacity="0.95"/>
<rect x="0" y="1400" width="720" height="4" fill="url(#gold-accent)"/>
</svg>