"info":
  "title": "Teen Patti Pro — B2B Game Provider API"
  "version": "1.0.0"
  "summary": "Single-integration provider API for operators and aggregators."
  "description": "One API connection and one API key per operator. The operator authenticates every server-to-server call with an HMAC-SHA256 signature, creates a player session, receives a launch URL, and drives wallet operations with idempotent debit/credit/rollback. The engine stays authoritative for cards, pots, timing, winners and settlement. Money of record is held by the operator; the provider keeps an immutable transaction ledger. V1 exposes the existing Teen Patti Pro engine only: the engine has a single betting phase and no player-turn/fold/show phase, so those events are not emitted."
