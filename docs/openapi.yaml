"x-provider":
  "authentication":
    "headers":
      - "X-API-Key"
      - "X-Timestamp"
      - "X-Nonce"
      - "X-Signature"
    "algorithm": "HMAC-SHA256"
    "canonical": "METHOD\\nPATH\\nTIMESTAMP\\nNONCE\\nSHA256(raw_body)"
    "path_note": "PATH excludes the query string; do not append it before signing."
    "signature_encoding": "lowercase hex"
    "timestamp_window_seconds": 300
    "replay": "nonces are single use inside the timestamp window"
  "websocket":
    "path": "/ws/game"
    "auth": "{\"session_token\": \"gst_...\"}"
    "events":
      - "room.joined"
      - "game.waiting"
      - "game.started"
      - "card.dealt"
      - "bet.required"
      - "bet.placed"
      - "betting.closed"
      - "game.finished"
      - "round.settled"
      - "game.error"
    "v1_not_emitted":
      - "turn.started"
      - "player.folded"
      - "show.requested"
    "v1_note": "The V1 engine has a single betting phase and no player-turn phase, so turn/fold/show events are documented as absent rather than simulated."
