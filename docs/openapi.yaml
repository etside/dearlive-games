"components":
  "securitySchemes":
    "ProviderHmac":
      "type": "apiKey"
      "in": "header"
      "name": "X-API-Key"
      "description": "Signed request authentication. Sign the canonical string 'METHOD\\nPATH\\nTIMESTAMP\\nNONCE\\nSHA256(raw_body)' with HMAC-SHA256 using the shared secret and send the lowercase hex digest in X-Signature. Timestamps outside the accepted window and reused nonces are rejected. Static secrets are never placed in a player app. Staging can also issue short-lived, game-scoped TEST-only keys through the staging API-key endpoints; those secrets are returned once and never listed."
  "parameters":
    "SessionId":
      "name": "sessionId"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
    "TableId":
      "name": "tableId"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
    "Game":
      "name": "game"
      "in": "path"
      "required": true
      "description": "Game slug. Teen Patti bets on positions, the wheels bet on options."
      "schema":
        "type": "string"
        "enum":
          - "teen-patti"
          - "greedy-lion"
          - "monkey-wheel"
    "PlayerId":
      "name": "playerId"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
    "IdempotencyKey":
      "name": "Idempotency-Key"
      "in": "header"
      "required": true
      "schema":
        "type": "string"
        "maxLength": 128
      "description": "Unique per logical transaction. Repeats return the original result; reuse with a different payload is rejected."
  "schemas":
    "Envelope":
      "type": "object"
      "required":
        - "success"
        - "code"
        - "message"
        - "serverTime"
      "properties":
        "success":
          "type": "boolean"
        "code":
          "type": "string"
        "message":
          "type": "string"
        "data":
          "type":
            - "object"
            - "array"
            - "null"
        "serverTime":
          "type": "integer"
          "description": "Server clock in ms; client clocks are untrusted."
        "requestId":
          "type": "string"
    "Error":
      "type": "object"
      "required":
        - "success"
        - "code"
        - "message"
      "properties":
        "success":
          "const": false
        "code":
          "type": "string"
          "enum":
            - "OK"
            - "UNAUTHENTICATED"
            - "INVALID_SIGNATURE"
            - "INVALID_TIMESTAMP"
            - "INVALID_NONCE"
            - "REPLAYED_REQUEST"
            - "FORBIDDEN"
            - "NOT_FOUND"
            - "VALIDATION_ERROR"
            - "INSUFFICIENT_BALANCE"
            - "DUPLICATE_REQUEST"
            - "STATE_CONFLICT"
            - "BETTING_CLOSED"
            - "RATE_LIMITED"
            - "TBC_RULE_UNCONFIRMED"
            - "INTERNAL_ERROR"
            - "UNAVAILABLE"
        "message":
          "type": "string"
        "data":
          "type":
            - "object"
            - "array"
            - "null"
        "serverTime":
          "type": "integer"
        "requestId":
          "type": "string"
    "Health":
      "type": "object"
      "properties":
        "status":
          "type": "string"
          "enum":
            - "ok"
            - "degraded"
        "game_code":
          "type": "string"
        "engine":
          "type": "string"
        "provider_api":
          "type": "string"
        "provider_auth_configured":
          "type": "boolean"
        "wallet_backend":
          "type": "string"
        "currency":
          "type": "string"
        "tables":
          "type": "integer"
        "live_tables":
          "type": "integer"
        "redis":
          "type": "boolean"
        "serverTime":
          "type": "integer"
    "Game":
      "type": "object"
      "properties":
        "game_code":
          "type": "string"
        "name":
          "type": "string"
        "status":
          "type": "string"
        "engine":
          "type": "string"
        "currencies":
          "type": "array"
          "items":
            "type": "string"
        "min_bet":
          "type": "integer"
        "max_bet":
          "type": "integer"
        "max_players":
          "type": "integer"
        "tables":
          "type": "array"
          "items":
            "type": "string"
        "actions":
          "type": "array"
          "items":
            "type": "string"
        "realtime":
          "type": "object"
    "GamesResponse":
      "type": "object"
      "properties":
        "games":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/Game"
    "SessionCreateRequest":
      "type": "object"
      "required":
        - "player_id"
      "properties":
        "player_id":
          "type": "string"
          "maxLength": 128
          "description": "Operator-owned player identity."
        "game_code":
          "type": "string"
          "default": "teen_patti_pro"
          "enum":
            - "teen_patti_pro"
            - "greedy_lion"
            - "monkey_wheel"
        "currency":
          "type": "string"
          "default": "COIN"
        "language":
          "type": "string"
          "default": "en"
        "platform":
          "type": "string"
          "default": "web"
        "return_url":
          "type": "string"
          "format": "uri"
          "description": "Where the player app returns after play."
        "table_id":
          "type": "string"
          "description": "Optional explicit table; otherwise matchmaking selects one."
        "amount":
          "type": "integer"
          "minimum": 1
          "description": "Optional intended stake, used by matchmaking and range validation."
    "SessionResponse":
      "type": "object"
      "properties":
        "success":
          "const": true
        "session_id":
          "type": "string"
        "session_token":
          "type": "string"
          "description": "Short-lived player credential (gst_...)."
        "token_type":
          "type": "string"
          "const": "Bearer"
        "game_code":
          "type": "string"
        "table_id":
          "type": "string"
        "currency":
          "type": "string"
        "language":
          "type": "string"
        "platform":
          "type": "string"
        "return_url":
          "type": "string"
        "launch_url":
          "type": "string"
          "format": "uri"
        "expires_at":
          "type": "string"
          "format": "date-time"
        "expires_at_ms":
          "type": "integer"
        "websocket_url":
          "type": "string"
    "SessionState":
      "type": "object"
      "properties":
        "session_id":
          "type": "string"
        "player_id":
          "type": "string"
        "game_id":
          "type": "string"
        "table_id":
          "type": "string"
        "created_at":
          "type": "string"
          "format": "date-time"
        "last_seen_at":
          "type": "string"
          "format": "date-time"
        "active":
          "type": "boolean"
        "table":
          "type":
            - "object"
            - "null"
    "SessionEnded":
      "type": "object"
      "properties":
        "session_id":
          "type": "string"
        "ended":
          "const": true
        "revoked_tokens":
          "type": "integer"
    "JoinRequest":
      "type": "object"
      "properties":
        "session_id":
          "type": "string"
        "session_token":
          "type": "string"
        "player_id":
          "type": "string"
          "description": "Server-to-server only; ignored when a session is supplied."
        "currency":
          "type": "string"
        "amount":
          "type": "integer"
          "minimum": 1
    "JoinResponse":
      "type": "object"
      "properties":
        "table_id":
          "type": "string"
        "player_id":
          "type": "string"
        "seats":
          "type": "array"
          "items":
            "type": "string"
        "players":
          "type": "integer"
        "max_players":
          "type": "integer"
        "status":
          "type": "string"
        "joined":
          "const": true
        "already_seated":
          "type": "boolean"
    "LeaveResponse":
      "type": "object"
      "properties":
        "table_id":
          "type": "string"
        "player_id":
          "type": "string"
        "seats":
          "type": "array"
          "items":
            "type": "string"
        "removed":
          "type": "boolean"
    "SessionRefRequest":
      "type": "object"
      "properties":
        "session_id":
          "type": "string"
        "session_token":
          "type": "string"
        "player_id":
          "type": "string"
    "ActionRequest":
      "type": "object"
      "required":
        - "action"
        - "amount"
      "description": "Send the choice under the field the game reports in choice_field: position for Teen Patti, option_id for the wheels."
      "properties":
        "action":
          "type": "string"
          "enum":
            - "bet"
          "description": "V1 supports betting only."
        "position":
          "type": "string"
          "enum":
            - "A"
            - "B"
            - "C"
        "option_id":
          "type": "string"
          "description": "Wheel option, e.g. cub, mane, pride."
        "amount":
          "type": "integer"
          "minimum": 1
        "session_id":
          "type": "string"
        "session_token":
          "type": "string"
        "player_id":
          "type": "string"
    "ActionResponse":
      "type": "object"
      "properties":
        "table_id":
          "type": "string"
        "player_id":
          "type": "string"
        "action":
          "type": "string"
        "accepted":
          "const": true
        "bet_id":
          "type": "string"
        "round_id":
          "type": "string"
        "position":
          "type": "string"
        "amount":
          "type": "integer"
        "decision_time":
          "type": "integer"
    "StateResponse":
      "type": "object"
      "properties":
        "table_id":
          "type": "string"
        "player_id":
          "type": "string"
        "state":
          "type": "object"
          "description": "Authoritative snapshot; unrevealed hands stay masked."
    "HistoryResponse":
      "type": "object"
      "description": "Teen Patti returns settled rounds; the wheels return their recent authoritative results. Player bets are returned when the caller identifies a player."
      "properties":
        "game_code":
          "type": "string"
        "table_id":
          "type": "string"
        "count":
          "type": "integer"
        "rounds":
          "type": "array"
          "items":
            "type": "object"
        "bets":
          "type": "array"
          "items":
            "type": "object"
    "BalanceResponse":
      "type": "object"
      "properties":
        "player_id":
          "type": "string"
        "available":
          "type": "integer"
        "currency":
          "type": "string"
    "WalletWriteRequest":
      "type": "object"
      "required":
        - "player_id"
        - "amount"
        - "reference"
      "properties":
        "player_id":
          "type": "string"
        "amount":
          "type": "integer"
          "minimum": 1
        "currency":
          "type": "string"
        "game_code":
          "type": "string"
        "round_id":
          "type": "string"
        "reference":
          "type": "string"
          "maxLength": 128
    "WalletRollbackRequest":
      "type": "object"
      "required":
        - "player_id"
        - "original_reference"
        - "reason"
      "properties":
        "player_id":
          "type": "string"
        "original_reference":
          "type": "string"
        "reason":
          "type": "string"
          "maxLength": 128
        "currency":
          "type": "string"
    "Transaction":
      "type": "object"
      "properties":
        "txn_id":
          "type": "string"
        "type":
          "type": "string"
          "enum":
            - "debit"
            - "credit"
            - "rollback"
        "status":
          "type": "string"
          "enum":
            - "SUCCESS"
            - "ROLLED_BACK"
        "player_id":
          "type": "string"
        "amount":
          "type": "integer"
        "currency":
          "type": "string"
        "reference":
          "type": "string"
        "idempotency_key":
          "type": "string"
        "game_code":
          "type": "string"
        "round_id":
          "type": "string"
        "original_reference":
          "type": "string"
        "reverses_txn_id":
          "type": "string"
        "reason":
          "type": "string"
        "actor":
          "type": "string"
        "replayed":
          "type": "boolean"
          "description": "True when this response is the original result of a repeated key."
        "created_at":
          "type": "integer"
    "TransactionListResponse":
      "type": "object"
      "properties":
        "player_id":
          "type": "string"
        "count":
          "type": "integer"
        "transactions":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/Transaction"
    "StagingKeyProvisionRequest":
      "type": "object"
      "required":
        - "pin"
        - "label"
        - "games"
      "properties":
        "pin":
          "type": "string"
          "description": "Configured STAGING_PROVISION_PIN. Staging-only."
        "label":
          "type": "string"
          "maxLength": 64
        "role":
          "type": "string"
          "enum":
            - "operator"
            - "auditor"
          "default": "operator"
        "games":
          "type": "array"
          "minItems": 1
          "items":
            "type": "string"
            "enum":
              - "teen_patti_pro"
              - "greedy_lion"
              - "monkey_wheel"
        "ttl_seconds":
          "type": "integer"
          "minimum": 900
          "maximum": 2592000
          "default": 86400
    "StagingKeyIssued":
      "type": "object"
      "description": "The key_secret is returned exactly once and must be stored immediately by the Super Admin console."
      "properties":
        "key_id":
          "type": "string"
        "key_secret":
          "type": "string"
        "label":
          "type": "string"
        "role":
          "type": "string"
          "enum":
            - "operator"
            - "auditor"
        "games":
          "type": "array"
          "items":
            "type": "string"
        "environment":
          "type": "string"
          "const": "staging"
        "test_only":
          "type": "boolean"
          "const": true
        "created_at_ms":
          "type": "integer"
        "expires_at_ms":
          "type": "integer"
    "StagingKeyMetadata":
      "type": "object"
      "description": "Public key metadata. It never contains a secret."
      "properties":
        "key_id":
          "type": "string"
        "label":
          "type": "string"
        "role":
          "type": "string"
          "enum":
            - "operator"
            - "auditor"
        "games":
          "type": "array"
          "items":
            "type": "string"
        "environment":
          "type": "string"
          "const": "staging"
        "test_only":
          "type": "boolean"
          "const": true
        "revoked":
          "type": "boolean"
        "created_at_ms":
          "type": "integer"
        "expires_at_ms":
          "type": "integer"
        "revoked_at_ms":
          "type":
            - "integer"
            - "null"
    "StagingKeyListResponse":
      "type": "object"
      "properties":
        "keys":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/StagingKeyMetadata"
        "count":
          "type": "integer"
    "StagingKeyRevokeRequest":
      "type": "object"
      "required":
        - "key_id"
      "properties":
        "key_id":
          "type": "string"
    "StagingKeyRevoked":
      "type": "object"
      "properties":
