          "type": "boolean"
          "const": true
    "StagingKeyRotateRequest":
      "type": "object"
      "required":
        - "key_id"
        - "pin"
      "properties":
        "key_id":
          "type": "string"
        "pin":
          "type": "string"
        "ttl_seconds":
          "type": "integer"
          "minimum": 900
          "maximum": 2592000
    "Table":
      "type": "object"
      "properties":
        "table_id":
          "type": "string"
        "label":
          "type": "string"
        "min_bet":
          "type": "integer"
        "max_bet":
          "type": "integer"
        "max_players":
          "type": "integer"
        "currency":
