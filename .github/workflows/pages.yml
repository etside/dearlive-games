# Deploy the Teen Patti Pro WebView client (static) to GitHub Pages.
# Live play: open index.html with ?api=<engine>&ws=<ws>&session=<id>&room=<room>.
# Offline: demo.html replays a real engine round (demo_round.json, generated by
# tools/make_demo.py — regenerate before release).
name: Deploy game client to Pages
on:
  push:
    branches: [main]
    paths:
      - "games/teen_patti_pro/client/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate demo bundle
        run: |
          python3 -c "import json;d=json.load(open('games/teen_patti_pro/client/demo_round.json'));assert len(d['frames'])==5, d;print('demo frames ok:', [f['label'] for f in d['frames']])"
          grep -q "demo_round.json" games/teen_patti_pro/client/demo.html
      - name: Assemble Pages artifact (client at site root)
        run: |
          mkdir -p _site
          cp games/teen_patti_pro/client/index.html _site/
          cp games/teen_patti_pro/client/game.js _site/
          cp games/teen_patti_pro/client/demo.html _site/
          cp games/teen_patti_pro/client/demo_round.json _site/
          ls -la _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
