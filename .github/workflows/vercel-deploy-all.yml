name: Deploy All Vercel Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-super-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspaces

      - name: Build super-admin
        run: npm run build:super-admin

      - name: Check Super Admin Vercel configuration
        id: check
        shell: bash
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.SUPER_ADMIN_PROJECT_ID }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Super Admin deploy skipped: secrets not configured"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Super Admin to Vercel
        uses: amondnet/vercel-action@v25
        if: github.ref == 'refs/heads/main' && steps.check.outputs.configured == 'true'
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.SUPER_ADMIN_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./apps/super-admin

  deploy-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspaces

      - name: Build admin
        run: npm run build:admin

      - name: Check Admin Vercel configuration
        id: check
        shell: bash
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.ADMIN_PROJECT_ID }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Admin deploy skipped: secrets not configured"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Admin to Vercel
        uses: amondnet/vercel-action@v25
        if: github.ref == 'refs/heads/main' && steps.check.outputs.configured == 'true'
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.ADMIN_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./apps/admin

  deploy-player:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspaces

      - name: Build player
        run: npm run build:player

      - name: Check Player Vercel configuration
        id: check
        shell: bash
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.PLAYER_PROJECT_ID }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Player deploy skipped: secrets not configured"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Player to Vercel
        uses: amondnet/vercel-action@v25
        if: github.ref == 'refs/heads/main' && steps.check.outputs.configured == 'true'
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.PLAYER_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./apps/player
