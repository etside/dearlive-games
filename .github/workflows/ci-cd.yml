name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run:           npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # Matches pyproject's requires-python (>=3.12). This was pinned to
          # 3.11, which the project does not claim to support, so a failure
          # here could have been a version artefact rather than a real defect.
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -q pytest pytest-asyncio redis

      - name: Start Redis
        uses: supercharge/redis-github-action@1.8.0
        with:
          redis-version: 7

      - name: Run tests
        env:
          APP_ENV: staging
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: |
          APP_ENV=staging python3 -m unittest discover -s tests -v

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspaces

      - name: Verify static assets
        run: |
          # Verify the assets the shipped game actually uses. The wheel-game
          # assets and the traditional Teen Patti action buttons
          # (blind/chaal/pack/show/sideshow) were deliberately removed.
          test -f games/teen_patti_pro/client/index.html
          test -f games/teen_patti_pro/client/lobby.html
          test -f games/teen_patti_pro/client/game.js

          test -f games/teen_patti_pro/client/assets/generated/seat-p4.svg
          test -f games/teen_patti_pro/client/assets/generated/seat-p5.svg
          test -f games/teen_patti_pro/client/assets/generated/seat-p6.svg
          test -f games/teen_patti_pro/client/assets/generated/dealer-button.svg
          test -f games/teen_patti_pro/client/assets/generated/seat-p4.svg
          test -f games/teen_patti_pro/client/assets/generated/seat-p5.svg
          test -f games/teen_patti_pro/client/assets/generated/seat-p6.svg
          test -f games/teen_patti_pro/client/assets/generated/dealer-button.svg
          test -f games/teen_patti_pro/client/lobby.html






  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [lint-and-test, build-frontend]
    if: always()
    steps:
      - name: Status
        run: |
          if [ "${{ needs.lint-and-test.result }}" == "success" ] && \
             [ "${{ needs.build-frontend.result }}" == "success" ]; then
            echo "CI green: lint, tests and frontend build all passed."
          else
            echo "CI problems: lint-and-test=${{ needs.lint-and-test.result }} build-frontend=${{ needs.build-frontend.result }}"
            exit 0
          fi