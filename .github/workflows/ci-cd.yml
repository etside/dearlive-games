      - name: Check Vercel secrets
        id: check
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.PLAYER_PROJECT_ID }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Vercel Player deploy skipped: secrets not configured"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Player to Vercel
        if: steps.check.outputs.skip != 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.PLAYER_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./apps/player
        continue-on-error: true

  deploy-admin:
    name: Deploy Admin App
    runs-on: ubuntu-latest
    needs: [lint-and-test, build-frontend]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Vercel secrets
        id: check
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.ADMIN_PROJECT_ID }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Vercel Admin deploy skipped: secrets not configured"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Admin to Vercel
        if: steps.check.outputs.skip != 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.ADMIN_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./apps/admin
        continue-on-error: true

  deploy-super-admin:
    name: Deploy Super Admin App
    runs-on: ubuntu-latest
    needs: [lint-and-test, build-frontend]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Vercel secrets
        id: check
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.SUPER_ADMIN_PROJECT_ID }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Vercel Super Admin deploy skipped: secrets not configured"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Super Admin to Vercel
        if: steps.check.outputs.skip != 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.SUPER_ADMIN_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./apps/super-admin
        continue-on-error: true

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-player, deploy-admin, deploy-super-admin]
    if: always()
    steps:
      - name: Status
        run: |
          if [ "${{ needs.deploy-api.result }}" == "success" ] && \
             [ "${{ needs.deploy-player.result }}" == "success" ] && \
             [ "${{ needs.deploy-admin.result }}" == "success" ] && \
             [ "${{ needs.deploy-super-admin.result }}" == "success" ]; then
            echo "All deployments successful!"
          elif [ "${{ needs.deploy-api.result }}" == "skipped" ] && \
             [ "${{ needs.deploy-player.result }}" == "skipped" ] && \
             [ "${{ needs.deploy-admin.result }}" == "skipped" ] && \
             [ "${{ needs.deploy-super-admin.result }}" == "skipped" ]; then
            echo "All deployments skipped (secrets not configured)"
          else
            echo "Deploy results: api=${{ needs.deploy-api.result }} player=${{ needs.deploy-player.result }} admin=${{ needs.deploy-admin.result }} super-admin=${{ needs.deploy-super-admin.result }}"
            echo "Some deployments skipped (secrets not configured) or failed — see job logs"
            exit 0
          fi