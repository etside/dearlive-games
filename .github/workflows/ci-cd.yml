name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run:           npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # Matches pyproject's requires-python (>=3.12). This was pinned to
          # 3.11, which the project does not claim to support, so a failure
          # here could have been a version artefact rather than a real defect.
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -q pytest pytest-asyncio redis

      - name: Start Redis
        uses: supercharge/redis-github-action@1.8.0
        with:
          redis-version: 7

      - name: Run tests
        env:
          APP_ENV: staging
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: |
          APP_ENV=staging python3 -m unittest discover -s tests -v

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspaces

      - name: Verify static assets
        run: |
          # Verify the assets the shipped game actually uses. The wheel-game
          # assets and the traditional Teen Patti action buttons
          # (blind/chaal/pack/show/sideshow) were deliberately removed.
          test -f games/teen_patti_pro/client/index.html
          test -f games/teen_patti_pro/client/lobby.html
          test -f games/teen_patti_pro/client/game.js

          test -f games/teen_patti_pro/client/assets/generated/seat-p4.svg
          test -f games/teen_patti_pro/client/assets/generated/seat-p5.svg
          test -f games/teen_patti_pro/client/assets/generated/seat-p6.svg
          test -f games/teen_patti_pro/client/assets/generated/dealer-button.svg
          test -f games/teen_patti_pro/client/assets/generated/seat-p4.svg
          test -f games/teen_patti_pro/client/assets/generated/seat-p5.svg
          test -f games/teen_patti_pro/client/assets/generated/seat-p6.svg
          test -f games/teen_patti_pro/client/assets/generated/dealer-button.svg
          test -f games/teen_patti_pro/client/lobby.html






  deploy-api:
    name: Deploy API to Vercel
    runs-on: ubuntu-latest
    needs: [lint-and-test, build-frontend]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Vercel secrets
        id: check
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.API_PROJECT_ID }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Vercel API deploy skipped: secrets not configured"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy API to Vercel
        if: steps.check.outputs.skip != 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.API_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./
        continue-on-error: true

  deploy-player:
    name: Deploy Player App
    runs-on: ubuntu-latest
    needs: [lint-and-test, build-frontend]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Vercel secrets
        id: check
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.PLAYER_PROJECT_ID }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Vercel Player deploy skipped: secrets not configured"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Player to Vercel
        if: steps.check.outputs.skip != 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.PLAYER_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./apps/player
        continue-on-error: true

  deploy-admin:
    name: Deploy Admin App
    runs-on: ubuntu-latest
    needs: [lint-and-test, build-frontend]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Vercel secrets
        id: check
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.ADMIN_PROJECT_ID }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Vercel Admin deploy skipped: secrets not configured"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Admin to Vercel
        if: steps.check.outputs.skip != 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.ADMIN_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./apps/admin
        continue-on-error: true

  deploy-super-admin:
    name: Deploy Super Admin App
    runs-on: ubuntu-latest
    needs: [lint-and-test, build-frontend]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Vercel secrets
        id: check
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.SUPER_ADMIN_PROJECT_ID }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Vercel Super Admin deploy skipped: secrets not configured"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Super Admin to Vercel
        if: steps.check.outputs.skip != 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.SUPER_ADMIN_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./apps/super-admin
        continue-on-error: true

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-player, deploy-admin, deploy-super-admin]
    if: always()
    steps:
      - name: Status
        run: |
          if [ "${{ needs.deploy-api.result }}" == "success" ] && \
             [ "${{ needs.deploy-player.result }}" == "success" ] && \
             [ "${{ needs.deploy-admin.result }}" == "success" ] && \
             [ "${{ needs.deploy-super-admin.result }}" == "success" ]; then
            echo "All deployments successful!"
          elif [ "${{ needs.deploy-api.result }}" == "skipped" ] && \
             [ "${{ needs.deploy-player.result }}" == "skipped" ] && \
             [ "${{ needs.deploy-admin.result }}" == "skipped" ] && \
             [ "${{ needs.deploy-super-admin.result }}" == "skipped" ]; then
            echo "All deployments skipped (secrets not configured)"
          else
            echo "Deploy results: api=${{ needs.deploy-api.result }} player=${{ needs.deploy-player.result }} admin=${{ needs.deploy-admin.result }} super-admin=${{ needs.deploy-super-admin.result }}"
            echo "Some deployments skipped (secrets not configured) or failed — see job logs"
            exit 0
          fi